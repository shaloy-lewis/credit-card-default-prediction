name: credit-risk-phase8

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - phase8_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [platform]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copy .env.example to .env and set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    volumes:
      - phase8_minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [platform]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: credit-risk-mlflow:phase8
    command:
      - python
      - -m
      - credit_risk.platform.mlflow_server
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [platform]

  bootstrap:
    image: credit-risk-mlflow:phase8
    # The named deployment volume is created root-owned. This one-shot initializer
    # is the only container allowed to write it; the API mounts it read-only.
    user: "0:0"
    read_only: true
    command: ["credit-risk", "platform", "bootstrap", "--deployment-root", "/deployment"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET}
    volumes:
      - phase8_deployment:/deployment
    depends_on:
      mlflow: {condition: service_healthy}
    restart: "no"
    networks: [platform]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-risk-api:phase8
    environment:
      CREDIT_RISK_DEPLOYMENT_ROOT: /app/deployment
    volumes:
      - phase8_deployment:/app/deployment:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [platform]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: credit-risk-ui:phase8
    environment:
      CREDIT_RISK_API_URL: http://api:8080
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    driver: bridge

volumes:
  phase8_postgres_data:
  phase8_minio_data:
  phase8_deployment:
