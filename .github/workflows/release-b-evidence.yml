name: Release B evidence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: release-b-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Verify approved Release B snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12.3"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RELEASE_B_COMMIT: 7e571fc4fbb4e6cb99b0d66f8e7d72b24feccff4
    steps:
      - name: Check out patched revision for preservation checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Preserve historical reports, approvals, configurations and model manifests
        run: >-
          git diff --exit-code "$RELEASE_B_COMMIT" HEAD --
          reports configs models/selected_v1/manifest.json
      - name: Check out the approved historical release separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7e571fc4fbb4e6cb99b0d66f8e7d72b24feccff4
          path: .cache/release-b-approved
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: .cache/release-b-approved/uv.lock
      - name: Restore the historical environment and reviewed artifact
        working-directory: .cache/release-b-approved
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_B_COMMIT"
          uv sync --locked --all-extras --dev
          uv run credit-risk artifacts pull --cache-dir .cache/huggingface
          uv run credit-risk artifacts verify
          uv run credit-risk data build
      - name: Authenticate existing historical evidence without scoring
        working-directory: .cache/release-b-approved
        run: uv run python -m credit_risk.assurance.collect
      - name: Verify approved historical Release B dossier
        working-directory: .cache/release-b-approved
        run: >-
          uv run credit-risk release verify-b
          --expected-manifest-sha256 f5fa342b89e06c016ea7b632c8a252c472502186ab52ac68aba6992d652c8c88
          --approval configs/releases/release_b_owner_approval_v1.json
          --approval-sha256 9a40d17f038056e3e475762810ead7887cdf764be836dc6387bc19638e4f8f1f
      - name: Identify verification scope
        run: |
          printf 'Verified historical Release B at `%s`.\n\n' "$RELEASE_B_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'The separate CI workflow validates the patched revision. Historical approval does not approve new implementation changes.\n' >> "$GITHUB_STEP_SUMMARY"
