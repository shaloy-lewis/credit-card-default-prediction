name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project
        run: uv sync --locked --all-extras --dev

      - name: Check formatting
        run: uv run ruff format --check api.py app.py src/credit_risk tests

      - name: Lint
        run: uv run ruff check api.py app.py src/credit_risk tests

      - name: Type-check maintained boundaries
        run: uv run mypy src/credit_risk/artifacts.py src/credit_risk/artifact_distribution src/credit_risk/data src/credit_risk/modeling src/credit_risk/governance src/credit_risk/release src/credit_risk/inference src/credit_risk/registry src/credit_risk/platform src/credit_risk/cli.py api.py app.py

      - name: Run tests
        run: uv run pytest -m "not training and not artifact" --cov --cov-report=term-missing

      - name: Enforce artifact-distribution branch coverage
        run: >-
          uv run pytest tests/unit/artifact_distribution
          --cov=credit_risk.artifact_distribution --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Phase 1 data-package branch coverage
        run: >-
          uv run pytest tests/unit/data tests/unit/test_data_cli.py
          tests/integration/test_data_workflow.py
          --cov=credit_risk.data --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce one-pass governance branch coverage
        run: >-
          uv run pytest tests/unit/modeling/test_selection_workflow.py
          tests/unit/modeling/test_final_test.py
          tests/unit/modeling/test_final_test_workflow.py
          tests/unit/modeling/test_selection_contracts.py
          tests/unit/modeling/test_selection_analysis.py
          tests/unit/modeling/test_selection_models.py
          tests/unit/modeling/test_selected_bundle.py
          tests/integration/test_selection_protocol.py
          tests/integration/test_selection_split.py -m "not training"
          --cov=credit_risk.modeling.selection_contracts
          --cov=credit_risk.modeling.selection_analysis
          --cov=credit_risk.modeling.selection_models
          --cov=credit_risk.modeling.selected_bundle
          --cov=credit_risk.modeling.selection_workflow
          --cov=credit_risk.modeling.final_test
          --cov=credit_risk.modeling.final_test_workflow
          --cov=credit_risk.modeling.risk_policy
          --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Phase 5 governance branch coverage
        run: >-
          uv run pytest tests/unit/governance tests/unit/test_governance_cli.py
          tests/integration/test_phase5_protocol.py
          tests/integration/test_phase5_evidence.py
          tests/integration/test_governance_explanation_smoke.py
          -m "not training and not artifact"
          --cov=credit_risk.governance --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Phase 8 platform branch coverage
        run: >-
          uv run pytest tests/unit/platform tests/unit/test_platform_cli.py
          tests/integration/test_phase8_protocol.py
          -m "not training and not artifact"
          --cov=credit_risk.platform --cov-branch --cov-report=term-missing
          --cov-fail-under=90

  artifact-integration:
    name: Pull and test reviewed artifacts
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project
        run: uv sync --locked --all-extras --dev

      - name: Pull and verify reviewed artifact groups
        run: |
          uv run credit-risk artifacts pull --group selected --cache-dir .hf-cache
          uv run credit-risk artifacts pull --group legacy --cache-dir .hf-cache
          uv run credit-risk artifacts verify --group all

      - name: Run artifact-dependent tests
        run: uv run pytest -m "artifact and not training"

      - name: Enforce Release A evidence branch coverage
        run: >-
          uv run pytest tests/unit/release tests/unit/test_release_cli.py
          tests/integration/test_release_a_protocol.py
          tests/integration/test_release_a_evidence.py -m "not training"
          --cov=credit_risk.release --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Phase 6 inference branch coverage
        run: >-
          uv run pytest tests/unit/inference tests/unit/test_inference_cli.py
          tests/integration/test_api_health.py
          tests/integration/test_phase6_protocol.py
          tests/integration/test_phase6_evidence.py
          tests/integration/test_inference_parity.py -m "not training"
          --cov=credit_risk.inference --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Enforce Phase 7 registry branch coverage
        run: >-
          uv run pytest tests/unit/registry tests/unit/test_registry_cli.py
          tests/integration/test_phase7_protocol.py
          tests/integration/test_registry_workflow.py
          tests/integration/test_phase7_evidence.py -m "not training"
          --cov=credit_risk.registry --cov-branch --cov-report=term-missing
          --cov-fail-under=90

      - name: Prove offline clean recovery from the pinned cache
        run: |
          rm models/selected_v1/model.cbm artifacts/model.pkl artifacts/preprocessor.pkl
          uv run credit-risk artifacts pull --group all --cache-dir .hf-cache --offline
          uv run credit-risk artifacts verify --group all
          test "$(sha256sum models/selected_v1/model.cbm | cut -d ' ' -f 1)" = "844ec1c33a894cbf01dcaf8672443fa38d86a06b8965ed729afccaf08f24d88c"
          uv run pytest tests/integration/test_artifact_compatibility.py -q

  container:
    name: Build, test, and scan API container
    runs-on: ubuntu-latest
    needs: [quality, artifact-integration]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Plant excluded model sentinel
        run: echo "must not ship" > models/selected_v1/unapproved.bin

      - name: Build container
        run: docker build --tag credit-risk-api:ci .

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-api:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-api:ci
          format: cyclonedx
          output: credit-risk-api.cdx.json
          scanners: vuln

      - name: Upload software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credit-risk-api-sbom
          path: credit-risk-api.cdx.json
          if-no-files-found: error

      - name: Start container
        run: >-
          docker run --detach --name credit-risk-api-ci --publish 8080:8080
          --health-interval=1s --health-start-period=1s --health-timeout=3s
          --health-retries=10 credit-risk-api:ci

      - name: Wait for inference readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' credit-risk-api-ci)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker logs credit-risk-api-ci
              exit 1
            fi
            sleep 1
          done
          docker logs credit-risk-api-ci
          exit 1

      - name: Verify container contract
        shell: bash
        run: |
          test "$(docker exec credit-risk-api-ci whoami)" = "app"
          test "$(docker exec credit-risk-api-ci credit-risk version)" = "0.5.0"
          docker exec credit-risk-api-ci python -c "import credit_risk.data"
          docker exec credit-risk-api-ci python -c "import credit_risk.modeling"
          docker exec credit-risk-api-ci python -c "import importlib.util; assert importlib.util.find_spec('pandera') is None"
          docker exec credit-risk-api-ci python -c "import importlib.util; assert importlib.util.find_spec('mlflow') is None"
          docker exec credit-risk-api-ci python -c "import importlib.util; assert importlib.util.find_spec('huggingface_hub') is None"
          set +e
          data_output="$(docker exec credit-risk-api-ci credit-risk data build --offline 2>&1)"
          data_status=$?
          set -e
          test "$data_status" -eq 1
          grep --fixed-strings "install the project with the 'data' extra" <<<"$data_output"
          ! grep --fixed-strings "Traceback" <<<"$data_output"
          set +e
          model_output="$(docker exec credit-risk-api-ci credit-risk model baseline 2>&1)"
          model_status=$?
          set -e
          test "$model_status" -eq 1
          grep --fixed-strings "historical and cannot be rerun" <<<"$model_output"
          ! grep --fixed-strings "Traceback" <<<"$model_output"
          set +e
          candidate_output="$(docker exec credit-risk-api-ci credit-risk model candidate 2>&1)"
          candidate_status=$?
          set -e
          test "$candidate_status" -eq 1
          grep --fixed-strings "historical and cannot be rerun" <<<"$candidate_output"
          ! grep --fixed-strings "Traceback" <<<"$candidate_output"
          set +e
          candidate_evidence_output="$(docker exec credit-risk-api-ci credit-risk model candidate-evidence 2>&1)"
          candidate_evidence_status=$?
          set -e
          test "$candidate_evidence_status" -eq 1
          grep --fixed-strings "historical and cannot be rerun" <<<"$candidate_evidence_output"
          ! grep --fixed-strings "Traceback" <<<"$candidate_evidence_output"
          set +e
          selection_output="$(docker exec credit-risk-api-ci credit-risk model select 2>&1)"
          selection_status=$?
          set -e
          test "$selection_status" -eq 1
          grep --fixed-strings "install the project with the 'data' extra" <<<"$selection_output"
          ! grep --fixed-strings "Traceback" <<<"$selection_output"
          set +e
          final_test_output="$(docker exec credit-risk-api-ci credit-risk model final-test 2>&1)"
          final_test_status=$?
          set -e
          test "$final_test_status" -eq 1
          grep --fixed-strings "Final-test evaluation was permanently consumed" <<<"$final_test_output"
          grep --fixed-strings "No reevaluation is permitted" <<<"$final_test_output"
          ! grep --fixed-strings "Traceback" <<<"$final_test_output"
          set +e
          governance_output="$(docker exec credit-risk-api-ci credit-risk governance build 2>&1)"
          governance_status=$?
          set -e
          test "$governance_status" -eq 1
          grep --fixed-strings "install the project with the 'data' extra" <<<"$governance_output"
          ! grep --fixed-strings "Traceback" <<<"$governance_output"
          set +e
          platform_output="$(docker exec credit-risk-api-ci credit-risk platform verify 2>&1)"
          platform_status=$?
          set -e
          test "$platform_status" -eq 1
          grep --fixed-strings "Invalid Phase 8 platform configuration" <<<"$platform_output"
          ! grep --fixed-strings "Traceback" <<<"$platform_output"
          docker exec credit-risk-api-ci python -c "from pathlib import Path; assert all(not Path('/app', name).exists() for name in ('data', 'experiment', 'mlruns'))"
          docker exec credit-risk-api-ci python -c "from pathlib import Path; assert not Path('/app/artifacts').exists()"
          docker exec credit-risk-api-ci python -c "from pathlib import Path; assert sorted(path.name for path in Path('/app/models/selected_v1').iterdir()) == ['manifest.json', 'model.cbm']"
          docker exec credit-risk-api-ci python -c "from pathlib import Path; assert sorted(path.as_posix() for path in Path('/app/configs').rglob('*') if path.is_file()) == ['/app/configs/inference/phase6_v1.json']"
          docker cp tests/fixtures/inference_batch_v1.csv credit-risk-api-ci:/tmp/inference_batch_v1.csv
          docker exec credit-risk-api-ci credit-risk inference batch --input /tmp/inference_batch_v1.csv --as-of-date 2026-09-30 --snapshot-id container-clean --output-root /tmp/inference-output
          docker exec credit-risk-api-ci credit-risk inference verify --run-root /tmp/inference-output/2026-09-30/container-clean
          sed 's/acct-020,25000/acct-020,0/' tests/fixtures/inference_batch_v1.csv > /tmp/inference_batch_partial_v1.csv
          docker cp /tmp/inference_batch_partial_v1.csv credit-risk-api-ci:/tmp/inference_batch_partial_v1.csv
          set +e
          partial_output="$(docker exec credit-risk-api-ci credit-risk inference batch --input /tmp/inference_batch_partial_v1.csv --as-of-date 2026-09-30 --snapshot-id container-partial --output-root /tmp/inference-output 2>&1)"
          partial_status=$?
          set -e
          test "$partial_status" -eq 3
          grep --fixed-strings "completed_with_rejections" <<<"$partial_output"
          curl --fail --silent http://127.0.0.1:8080/ping | python -c "import json, sys; assert json.load(sys.stdin) == {'message': 'Health check successful!'}"
          curl --fail --silent http://127.0.0.1:8080/ready | python -c "import json, sys; assert json.load(sys.stdin) == {'status': 'ready'}"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data @tests/fixtures/prediction_request.json http://127.0.0.1:8080/predict)" = "404"
          curl --fail --silent --request POST --header 'Content-Type: application/json' --header 'X-Request-ID: ci-prediction' --data @tests/fixtures/prediction_request.json http://127.0.0.1:8080/v1/predict | python -c "import json, sys; response = json.load(sys.stdin); assert response['schema_version'] == '1.0.0'; assert response['trace_id'] == 'ci-prediction'; assert abs(response['probability_of_default'] - 0.190382) <= 1e-6; assert response['risk_band'] == 'standard'; assert len(response['reasons']) == 2; assert response['model_id'] == 'catboost_fixed'; assert response['bundle_id'] == 'selected_v1'; assert response['policy_id'] == 'outreach_top_10_v1'"

      - name: Remove test container
        if: always()
        run: docker rm --force credit-risk-api-ci || true

  platform:
    name: Build, persist, verify, and scan local platform
    runs-on: ubuntu-latest
    needs: [quality, artifact-integration]
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose contract
        run: docker compose --env-file .env.example -f docker-compose.platform.yml config --quiet

      - name: Build platform images
        run: docker compose --env-file .env.example -f docker-compose.platform.yml build

      - name: Verify platform image contracts
        shell: bash
        run: |
          test "$(docker run --rm --entrypoint whoami credit-risk-mlflow:phase8)" = "app"
          test "$(docker run --rm --entrypoint whoami credit-risk-ui:phase8)" = "app"
          test "$(docker run --rm --entrypoint credit-risk credit-risk-mlflow:phase8 version)" = "0.5.0"
          docker run --rm --entrypoint python credit-risk-mlflow:phase8 -c "from pathlib import Path; assert not Path('/app/.env').exists(); assert not Path('/app/data').exists(); assert not Path('/app/experiment').exists()"
          docker run --rm --entrypoint python credit-risk-mlflow:phase8 -c "import importlib.util; assert importlib.util.find_spec('huggingface_hub') is None"
          docker run --rm --entrypoint python credit-risk-ui:phase8 -c "from pathlib import Path; assert not Path('/app/.env').exists(); assert not Path('/app/models').exists(); assert not Path('/app/data').exists(); assert not Path('/app/experiment').exists()"

      - name: Start persistent local platform
        run: >-
          docker compose --env-file .env.example -f docker-compose.platform.yml
          up --detach --wait --wait-timeout 240

      - name: Verify registry, artifacts, deployment, and inference
        shell: bash
        run: |
          docker compose --env-file .env.example -f docker-compose.platform.yml run --rm --no-deps bootstrap credit-risk platform bootstrap --deployment-root /deployment
          docker compose --env-file .env.example -f docker-compose.platform.yml run --rm --no-deps bootstrap credit-risk platform verify --deployment-root /deployment
          curl --fail --silent http://127.0.0.1:5000/health
          curl --fail --silent http://127.0.0.1:8080/ping | python -c "import json, sys; assert json.load(sys.stdin) == {'message': 'Health check successful!'}"
          curl --fail --silent http://127.0.0.1:8080/ready | python -c "import json, sys; assert json.load(sys.stdin) == {'status': 'ready'}"
          curl --fail --silent --request POST --header 'Content-Type: application/json' --data @tests/fixtures/prediction_request.json http://127.0.0.1:8080/v1/predict | python -c "import json, sys; response = json.load(sys.stdin); assert abs(response['probability_of_default'] - 0.190382) <= 1e-6; assert response['model_id'] == 'catboost_fixed'; assert response['bundle_id'] == 'selected_v1'"

      - name: Prove persisted state survives restart
        shell: bash
        run: |
          docker compose --env-file .env.example -f docker-compose.platform.yml restart postgres minio mlflow api ui
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null && curl --fail --silent http://127.0.0.1:8080/ready >/dev/null && curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "60" ]]; then
              docker compose --env-file .env.example -f docker-compose.platform.yml ps --all
              docker compose --env-file .env.example -f docker-compose.platform.yml logs
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.example -f docker-compose.platform.yml run --rm --no-deps bootstrap credit-risk platform verify --deployment-root /deployment

      - name: Scan MLflow platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-mlflow:phase8
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Streamlit UI image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-ui:phase8
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate MLflow platform software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-mlflow:phase8
          format: cyclonedx
          output: credit-risk-mlflow.cdx.json
          scanners: vuln

      - name: Generate Streamlit UI software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-ui:phase8
          format: cyclonedx
          output: credit-risk-ui.cdx.json
          scanners: vuln

      - name: Upload platform software bills of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credit-risk-platform-sboms
          path: |
            credit-risk-mlflow.cdx.json
            credit-risk-ui.cdx.json
          if-no-files-found: error

      - name: Stop platform containers
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.platform.yml down
