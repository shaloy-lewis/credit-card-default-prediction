[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-early-warning"
version = "0.1.0"
description = "A governed credit-risk early-warning and intervention-prioritisation system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Shaloy Lewis" }]
dependencies = [
    "catboost==1.2.5",
    "click==8.1.7",
    "fastapi==0.111.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pydantic==2.7.4",
    "scikit-learn==1.4.2",
    "typer==0.12.3",
    "uvicorn[standard]==0.30.1",
]

[project.optional-dependencies]
demo = ["streamlit==1.35.0"]

[project.scripts]
credit-risk = "credit_risk.cli:app"

[dependency-groups]
dev = [
    "httpx==0.27.0",
    "mypy>=1.11,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["credit_risk*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts", "catboost_info", "experiment"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["catboost_info", "experiment"]

[[tool.mypy.overrides]]
module = ["catboost.*", "pandas.*", "sklearn.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: exercises multiple application components or committed artifacts",
]

[tool.coverage.run]
branch = true
source = ["credit_risk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
