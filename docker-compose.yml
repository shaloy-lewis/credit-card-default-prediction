services:
  api:
    build: .
    image: credit-risk-api:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
